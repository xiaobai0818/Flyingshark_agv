TebLocalPlannerROS:
  odom_topic: /odom
  map_frame: map

  teb_autosize: true
  dt_ref: 0.3
  dt_hysteresis: 0.1
  max_samples: 40
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 3.0
  global_plan_viapoint_sep: 0.4
  feasibility_check_no_poses: 3
  exact_arc_length: false

  max_vel_x: 0.35
  max_vel_x_backwards: 0.12
  max_vel_y: 0.0
  max_vel_theta: 1.0
  acc_lim_x: 0.25
  acc_lim_theta: 1.2
  min_turning_radius: 0.0
  wheelbase: 0.164
  cmd_angle_instead_rotvel: false
  holonomic_robot: false
  footprint_model:
    type: circular
    radius: 0.108

  xy_goal_tolerance: 0.12
  yaw_goal_tolerance: 0.18
  free_goal_vel: false

  # 圆形半径已经写在 footprint_model 里，这里是车体外再留的间隙。
  min_obstacle_dist: 0.08
  inflation_dist: 0.28
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 15
  costmap_converter_plugin: ""
  costmap_converter_spin_thread: true
  costmap_converter_rate: 5

  no_inner_iterations: 4
  no_outer_iterations: 3
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.05
  obstacle_cost_exponent: 4.0
  weight_max_vel_x: 2
  weight_max_vel_theta: 1
  weight_acc_lim_x: 1
  weight_acc_lim_theta: 1
  weight_kinematics_nh: 1000
  weight_kinematics_forward_drive: 8
  weight_kinematics_turning_radius: 1
  weight_optimaltime: 1
  weight_obstacle: 80
  weight_inflation: 0.2
  weight_viapoint: 1
  weight_adapt_factor: 2

  enable_homotopy_class_planning: false
  enable_multithreading: true
  shrink_horizon_backup: true
  oscillation_recovery: true
