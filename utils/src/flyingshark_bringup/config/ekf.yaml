sensor_timeout: 0.25
two_d_mode: true
transform_time_offset: 0.0
transform_timeout: 0.1
print_diagnostics: true
debug: false
publish_tf: true
publish_acceleration: false
smooth_lagged_data: false

map_frame: map
odom_frame: odom
base_link_frame: base_footprint
world_frame: odom

odom0: /wheel/odom
